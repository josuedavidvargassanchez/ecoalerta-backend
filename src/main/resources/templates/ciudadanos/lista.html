<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('Ciudadanos')}"></head>

<body>
    <header th:replace="~{fragmentos/comunes :: cabecera('ciudadanos')}"></header>

    <main class="contenedor">
        <div th:replace="~{fragmentos/comunes :: mensajes}"></div>

        <div class="encabezado-pagina">
            <div>
                <h1>Ciudadanos</h1>
                <p class="subtitulo">Personas que reportan problemas en los puntos críticos.</p>
            </div>
            <a class="btn" th:href="@{/ciudadanos/nuevo}">＋ Nuevo ciudadano</a>
        </div>

        <div class="vacio" th:if="${#lists.isEmpty(ciudadanos)}">
            <p>Todavía no hay ciudadanos registrados.</p>
            <a class="btn" th:href="@{/ciudadanos/nuevo}">Registrar el primero</a>
        </div>

        <section class="panel" th:unless="${#lists.isEmpty(ciudadanos)}">
            <div class="tabla-wrap">
                <table>
                    <thead>
                        <tr><th>Ciudadano</th><th>Contacto</th><th>Reportes</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${ciudadanos}">
                            <td>
                                <a class="enlace" th:href="@{/ciudadanos/{id}(id=${c.id()})}"><b th:text="${c.nombre()}">Nombre</b></a>
                                <div class="texto-suave" th:text="${c.email()}">correo</div>
                            </td>
                            <td>
                                <div th:text="${c.telefono()} ?: '—'">Teléfono</div>
                                <div class="texto-suave" th:text="${c.direccion()} ?: '—'">Dirección</div>
                            </td>
                            <td><span class="contador-pill" th:text="${c.reportes()}">0</span></td>
                            <td class="celda-accion">
                                <a class="btn btn-pequeno btn-claro" th:href="@{/ciudadanos/{id}(id=${c.id()})}">Ver ficha</a>
                                <a class="btn btn-pequeno btn-claro" th:href="@{/ciudadanos/{id}/editar(id=${c.id()})}">Editar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragmentos/comunes :: pie}"></footer>
</body>
</html>
