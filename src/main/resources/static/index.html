<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoAlerta - Monitoreo de Residuos Sólidos</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen text-gray-800">

  <header class="bg-emerald-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i data-lucide="trash-2" class="w-8 h-8 text-emerald-300"></i>
        <h1 class="text-2xl font-bold tracking-wide">EcoAlerta</h1>
      </div>
      <span class="bg-emerald-800 text-emerald-200 text-xs px-3 py-1 rounded-full font-semibold border border-emerald-600">
        Gestión Ambiental & Residuos
      </span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <section class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md border border-gray-200 h-fit">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="text-emerald-600"></i>
        Reportar Punto Crítico
      </h2>
      
      <form id="reporteForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Barrio / Sector</label>
          <input type="text" id="barrio" required placeholder="Ej: San Isidro" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Dirección / Referencia</label>
          <input type="text" id="direccionReferencia" required placeholder="Ej: Esquina de la cancha principal" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción del problema</label>
          <textarea id="descripcion" rows="3" required placeholder="Ej: Acumulación de escombros y plásticos..." 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nivel de Severidad</label>
          <select id="nivelSeveridad" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
            <option value="Bajo">Bajo (Poca basura)</option>
            <option value="Medio">Medio (Escombros leves)</option>
            <option value="Alto">Alto (Obstrucción parcial)</option>
            <option value="Crítico">Crítico (Riesgo sanitario/ambiental)</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition duration-200 flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i>
          Registrar Punto
        </button>
      </form>
    </section>

    <section class="lg:col-span-2 space-y-6">
 
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
          <p class="text-xs text-gray-500 uppercase font-bold">Total Puntos</p>
          <p id="totalCount" class="text-2xl font-bold text-gray-800">0</p>
        </div>
        <div class="bg-amber-50 p-4 rounded-xl shadow-sm border border-amber-200 text-center">
          <p class="text-xs text-amber-600 uppercase font-bold">Pendientes</p>
          <p id="pendientesCount" class="text-2xl font-bold text-amber-700">0</p>
        </div>
        <div class="bg-emerald-50 p-4 rounded-xl shadow-sm border border-emerald-200 text-center">
          <p class="text-xs text-emerald-600 uppercase font-bold">Limpiados</p>
          <p id="limpiadosCount" class="text-2xl font-bold text-emerald-700">0</p>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
            <i data-lucide="map-pin" class="text-emerald-600"></i>
            Puntos Críticos Registrados
          </h2>

          <div class="flex gap-2">
            <button onclick="filtrarPuntos('Todos')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-700">Todos</button>
            <button onclick="filtrarPuntos('Pendiente')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-800">Pendientes</button>
            <button onclick="filtrarPuntos('Limpiado')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-800">Limpiados</button>
          </div>
        </div>

        <div id="puntosContainer" class="space-y-4">
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
